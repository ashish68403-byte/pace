# PACE — Alembic configuration.
#
# The revisions execute raw SQL through op.execute(). There is no SQLAlchemy
# metadata and autogenerate is deliberately disabled-by-absence: the schema
# contains domains, enums, partial/expression indexes, GiST exclusion
# constraints, a bm25 index and halfvec-cast HNSW indexes, none of which
# autogenerate can round-trip. A generated diff that silently drops those is
# worse than no diff at all.
#
# sqlalchemy.url is intentionally EMPTY. migrations/env.py reads
# provenance.config.settings.database_url (env prefix PACE_) so that the app
# and the migrations can never disagree about which database they are pointed
# at, and so no credential is committed to this file.

[alembic]
script_location = migrations

# Makes `provenance` importable when alembic is invoked from the repo root.
prepend_sys_path = .

version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =


[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
